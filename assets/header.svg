      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="55%" stop-color="#F38649"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F38649" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F38649" stop-opacity="0"/>
