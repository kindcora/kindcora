  <rect x="0" y="236" width="1000" height="4" fill="url(#edge)"/>
  <rect x="40" y="62" width="3" height="86" fill="#F38649"/>

  <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8B949E" letter-spacing="2.5">KINDCORA</text>
  <text x="63" y="126" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="35" font-weight="700" fill="#E6EDF3">Hoàng Hà Đăng</text>
  <text x="64" y="154" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8B949E">CS student at UTT Hanoi &#183; TypeScript &#183; Python &#183; C/C++ &#183; Applied AI</text>
  <text x="64" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#F38649">I build practical tools, wire them into real workflows, and debug what breaks.</text>

  <g transform="translate(648,58)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6E7681" letter-spacing="1.5">CRON DRIFT, AFTER DIRECT DISPATCH</text>
    <line x1="0" y1="14" x2="300" y2="14" stroke="#21262D" stroke-width="1"/>
    <line x1="0" y1="52" x2="300" y2="52" stroke="#21262D" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="0" y1="98" x2="300" y2="98" stroke="#21262D" stroke-width="1"/>
    <path d="M0 30 L38 24 L76 38 L114 22 L152 32 L190 82 L228 89 L266 90 L300 90 L300 98 L0 98 Z" fill="url(#fade)"/>
    <path d="M0 30 L38 24 L76 38 L114 22 L152 32 L190 82 L228 89 L266 90 L300 90"
